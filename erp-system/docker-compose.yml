services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp123456
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - erp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uerp", "-perp123456"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3306:3306"

  api:
    build: ./api
    container_name: erp-api
    environment:
      DATABASE_URL: mysql+pymysql://erp:erp123456@mysql:3306/erp?charset=utf8mb4
      JWT_SECRET: dev-secret-change-me-in-prod
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./web
    container_name: erp-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  erp-mysql-data:
    # 固定卷名，复用已有数据卷（默认会加项目前缀 erp-system_ 导致读不到旧数据）
    name: erp-mysql-data
